<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Rodapé tropical verde com folhas de coqueiro grandes">
  <style>
    @keyframes wind-left { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes wind-right { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    .leaf-l { animation: wind-left 6s ease-in-out infinite; transform-origin: 15px 120px; }
    .leaf-r { animation: wind-right 7s ease-in-out infinite; transform-origin: 1185px 120px; }
  </style>
  <defs>
    <clipPath id="footer-clip">
      <rect width="1200" height="120" rx="18"/>
    </clipPath>
    
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#064E3B"/><stop offset=".5" stop-color="#087E72"/><stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    
    <g id="leaf">
      <path d="M 0 0 Q -50 -80 -120 -90" fill="none" stroke="#B7D66A" stroke-width="7" stroke-linecap="round"/>
      
      <path d="M -20 -35 Q -40 -15 -45 10 
               M -40 -60 Q -70 -35 -75 -5 
               M -60 -76 Q -90 -55 -100 -25 
               M -80 -86 Q -110 -70 -120 -40 
               M -100 -90 Q -125 -80 -135 -60" 
            fill="none" stroke="#157545" stroke-width="12" stroke-linecap="round"/>
            
      <path d="M -15 -25 Q -10 -45 10 -55 
               M -30 -47 Q -25 -70 -5 -85 
               M -50 -66 Q -40 -90 -20 -105 
               M -70 -80 Q -60 -105 -40 -115 
               M -90 -88 Q -80 -110 -65 -120 
               M -110 -92 Q -100 -110 -90 -115" 
            fill="none" stroke="#1E8A56" stroke-width="12" stroke-linecap="round"/>
    </g>
  </defs>
  
  <g clip-path="url(#footer-clip)">
    <rect width="1200" height="120" rx="18" fill="url(#g)"/>
    
    <g class="leaf-l">
      <!-- Escala aumentada para 1.25 e 0.85 -->
      <g transform="translate(15 140) scale(-1.25, 1.25) rotate(-15)"><use href="#leaf"/></g>
      <g transform="translate(-5 155) scale(-0.85, 0.85) rotate(25)"><use href="#leaf"/></g>
    </g>
    
    <g class="leaf-r">
      <g transform="translate(1185 140) scale(1.25, 1.25) rotate(-15)"><use href="#leaf"/></g>
      <g transform="translate(1205 155) scale(0.85, 0.85) rotate(25)"><use href="#leaf"/></g>
    </g>
    
    <g text-anchor="middle" font-family="Verdana, Arial, sans-serif">
      <text x="600" y="54" font-size="21" font-weight="700" fill="#FFFFFF">"será impossível se, e somente se desistir."</text>
      <text x="600" y="94" font-size="21" font-weight="780" fill="#FFFFFF">-Mayumi</text>
    </g>
  </g>
</svg>
